name = "my-paseocode"
main = "worker/index.js"
compatibility_date = "2026-05-07"
workers_dev = true
routes = [
  { pattern = "paseocode.space/*", zone_name = "paseocode.space" },
  { pattern = "www.paseocode.space/*", zone_name = "paseocode.space" }
]

[vars]
CREEM_API_BASE = "https://api.creem.io"
CREEM_ENV = "live"

[assets]
directory = "./dist"
binding = "SITE_ASSETS"
not_found_handling = "single-page-application"
run_worker_first = [
  "/",
  "/paseo-code",
  "/paseo-sh",
  "/paseo-github",
  "/paseo-agent",
  "/getpaseo-paseo",
  "/paseo-codex",
  "/paseo-opencode",
  "/pricing",
  "/privacy",
  "/terms",
  "/sitemap.xml",
  "/robots.txt",
  "/api/*"
]
